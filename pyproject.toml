[project]
name = "bashlex-perms"
version = "0.1.0"
description = "Claude Code hook that rejects forbidden shell commands"
readme = "README.md"
authors = [
    { name = "Claudio Spiess", email = "claudiosv@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bashlex>=0.18",
    "cchooks>=0.1.5",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
bashlex-perms = "bashlex_perms.checker:main"
bashlex-perms-cli = "bashlex_perms.cli:app"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
